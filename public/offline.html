  :root { --ink: #1b2a8f; --ink-deep: #121a4d; --paper: #f2f4f8; --butter: #fbebb0; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--paper); color: var(--ink-deep); font-family: "Archivo", system-ui, sans-serif; }
  header { background: #fff; border-bottom: 1.5px solid var(--ink); }
  header div, main { max-width: 28rem; margin: 0 auto; padding: 0 1rem; }
  header div { height: 4rem; display: flex; align-items: center; font-weight: 800; font-size: 1.5rem; color: var(--ink); font-family: "Archivo Condensed", "Archivo", sans-serif; }
  main { padding-top: 3rem; padding-bottom: 3rem; }
  .ticket-main { background: var(--butter); border: 1.5px solid var(--ink); border-bottom: 0; border-radius: 6px 6px 0 0; padding: 1.25rem; }
  .ticket-stub { background: var(--butter); border: 1.5px solid var(--ink); border-top-style: dashed; border-radius: 0 0 6px 6px; padding: 1rem 1.25rem; }
  h1 { margin: 0; font-size: 2.25rem; line-height: 1; font-weight: 800; color: var(--ink); font-family: "Archivo Condensed", "Archivo", sans-serif; }
  p { margin: 0.75rem 0 0; font-size: 1.0625rem; line-height: 1.5; }
  button { margin-top: 1.5rem; min-height: 44px; padding: 0 1.25rem; border-radius: 4px; border: 1.5px solid var(--ink); background: var(--ink); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
</style>
</head>
<body>
<header><div>Coupersville</div></header>
<main>
  <div class="ticket-main">
    <h1>You are offline</h1>
    <p>Coupersville cannot connect right now. Check your internet connection and try again.</p>
  </div>
  <div class="ticket-stub">
    <p style="margin:0">Coupons and redemption codes need a connection, so each one stays fresh and works only once.</p>
  </div>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
